name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: Test pure-Go backend
        run: CGO_ENABLED=0 go test -tags nolattice ./...
      - name: Test native LatticeDB backend
        run: go test ./...
      - name: Vet
        run: go vet ./...
