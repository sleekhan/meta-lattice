<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background & Glass Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.35" />
      <stop offset="45%" stop-color="#06B6D4" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0.6" />
    </linearGradient>

    <!-- Edge Neon Gradients -->
    <linearGradient id="edgeGradL01" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <linearGradient id="edgeGradL12" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="edgeGradL23" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="horizLattice" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.6" />
    </linearGradient>

    <!-- Node Glow Filters -->
    <filter id="neonGlowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="neonGlowPurple" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="nodeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Container Base Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3" />
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bgGlow)" />

  <!-- Background Decorative Lattice Grid Lines -->
  <g opacity="0.12" stroke="#818CF8" stroke-width="1.5" stroke-dasharray="4 6">
    <line x1="96" y1="140" x2="416" y2="140" />
    <line x1="96" y1="230" x2="416" y2="230" />
    <line x1="96" y1="320" x2="416" y2="320" />
    <line x1="96" y1="400" x2="416" y2="400" />
    <line x1="140" y1="96" x2="140" y2="416" />
    <line x1="256" y1="80" x2="256" y2="432" />
    <line x1="372" y1="96" x2="372" y2="416" />
  </g>

  <!-- Hierarchical Lattice Planes (Translucent Isometric Polygons) -->
  <!-- Level 2-3 Floor Plane -->
  <polygon points="256,290 390,360 256,430 122,360" fill="#6366F1" fill-opacity="0.07" stroke="#6366F1" stroke-opacity="0.25" stroke-width="1.5" />
  <!-- Level 1 Mid Plane -->
  <polygon points="256,180 366,238 256,296 146,238" fill="#06B6D4" fill-opacity="0.08" stroke="#06B6D4" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- LATTICE EDGES -->
  <!-- Connecting L3 Base Nodes -->
  <g stroke="url(#horizLattice)" stroke-width="2.5" stroke-opacity="0.75" stroke-linecap="round">
    <line x1="130" y1="360" x2="256" y2="425" />
    <line x1="256" y1="425" x2="382" y2="360" />
    <line x1="130" y1="360" x2="210" y2="310" />
    <line x1="382" y1="360" x2="302" y2="310" />
    <line x1="210" y1="310" x2="302" y2="310" />
    <line x1="210" y1="310" x2="256" y2="425" />
  </g>

  <!-- L2 to L3 Inter-tier Edges -->
  <g stroke="url(#edgeGradL23)" stroke-width="3" stroke-linecap="round">
    <line x1="180" y1="255" x2="130" y2="360" />
    <line x1="180" y1="255" x2="210" y2="310" />
    <line x1="332" y1="255" x2="382" y2="360" />
    <line x1="332" y1="255" x2="302" y2="310" />
    <line x1="256" y1="290" x2="256" y2="425" />
  </g>

  <!-- L1 to L2 Inter-tier Edges -->
  <g stroke="url(#edgeGradL12)" stroke-width="3.5" stroke-linecap="round">
    <line x1="256" y1="185" x2="180" y2="255" />
    <line x1="256" y1="185" x2="332" y2="255" />
    <line x1="256" y1="185" x2="256" y2="290" />
    <line x1="180" y1="255" x2="256" y2="290" />
    <line x1="332" y1="255" x2="256" y2="290" />
  </g>

  <!-- L0 (Apex Domain) to L1 Edges -->
  <g stroke="url(#edgeGradL01)" stroke-width="4" stroke-linecap="round">
    <line x1="256" y1="95" x2="256" y2="185" />
    <line x1="256" y1="95" x2="180" y2="255" stroke-dasharray="6 6" stroke-opacity="0.6" />
    <line x1="256" y1="95" x2="332" y2="255" stroke-dasharray="6 6" stroke-opacity="0.6" />
  </g>

  <!-- LATTICE NODES -->
  <!-- Layer 3 Nodes (Symbols / Functions) -->
  <g filter="url(#nodeShadow)">
    <circle cx="130" cy="360" r="10" fill="#EC4899" />
    <circle cx="130" cy="360" r="6" fill="#FDF2F8" />

    <circle cx="210" cy="310" r="9" fill="#EC4899" />
    <circle cx="210" cy="310" r="5" fill="#FDF2F8" />

    <circle cx="302" cy="310" r="9" fill="#EC4899" />
    <circle cx="302" cy="310" r="5" fill="#FDF2F8" />

    <circle cx="382" cy="360" r="10" fill="#EC4899" />
    <circle cx="382" cy="360" r="6" fill="#FDF2F8" />

    <circle cx="256" cy="425" r="12" fill="#F43F5E" />
    <circle cx="256" cy="425" r="7" fill="#FFF1F2" />
  </g>

  <!-- Layer 2 Nodes (Classes / Interfaces) -->
  <g filter="url(#nodeShadow)">
    <circle cx="180" cy="255" r="14" fill="#A855F7" />
    <circle cx="180" cy="255" r="8" fill="#FAF5FF" />

    <circle cx="332" cy="255" r="14" fill="#A855F7" />
    <circle cx="332" cy="255" r="8" fill="#FAF5FF" />

    <circle cx="256" cy="290" r="13" fill="#8B5CF6" />
    <circle cx="256" cy="290" r="7" fill="#F5F3FF" />
  </g>

  <!-- Layer 1 Node (Modules / Files) -->
  <g filter="url(#nodeShadow)">
    <!-- Outer Glow Pulse Ring -->
    <circle cx="256" cy="185" r="24" fill="none" stroke="#67E8F9" stroke-width="2" stroke-opacity="0.5" stroke-dasharray="4 4" />
    <circle cx="256" cy="185" r="18" fill="#06B6D4" filter="url(#neonGlowCyan)" />
    <circle cx="256" cy="185" r="16" fill="#0891B2" />
    <circle cx="256" cy="185" r="9" fill="#ECFEFF" />
  </g>

  <!-- Layer 0 Apex Node (Architecture Domain) -->
  <g filter="url(#nodeShadow)">
    <!-- Expanding Halo -->
    <circle cx="256" cy="95" r="32" fill="none" stroke="#A78BFA" stroke-width="2.5" stroke-opacity="0.6" />
    <circle cx="256" cy="95" r="22" fill="#818CF8" filter="url(#neonGlowPurple)" />
    <circle cx="256" cy="95" r="18" fill="#4F46E5" />
    <circle cx="256" cy="95" r="10" fill="#FFFFFF" />
  </g>

  <!-- High-Tech Coordinate / Level Badges -->
  <g font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" letter-spacing="1.5">
    <!-- L0 Tag -->
    <rect x="300" y="84" width="34" height="18" rx="5" fill="#1E1B4B" stroke="#6366F1" stroke-width="1.2" />
    <text x="307" y="97" fill="#A5B4FC">L0</text>

    <!-- L1 Tag -->
    <rect x="300" y="174" width="34" height="18" rx="5" fill="#083344" stroke="#06B6D4" stroke-width="1.2" />
    <text x="307" y="187" fill="#67E8F9">L1</text>

    <!-- L2 Tag -->
    <rect x="80" y="246" width="34" height="18" rx="5" fill="#2E1065" stroke="#A855F7" stroke-width="1.2" />
    <text x="87" y="259" fill="#D8B4FE">L2</text>

    <!-- L3 Tag -->
    <rect x="398" y="352" width="34" height="18" rx="5" fill="#4C0519" stroke="#F43F5E" stroke-width="1.2" />
    <text x="405" y="365" fill="#FDA4AF">L3</text>
  </g>
</svg>
